name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Nightly 02:00 UTC — runs on default branch (main)
  workflow_dispatch:

permissions:
  contents: read
  checks: write  # required by dorny/test-reporter to create check annotations

jobs:
  test:
    name: Docker Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-api-automation .

      - name: Check formatting
        run: docker run --rm playwright-api-automation ruff format --check .

      - name: Lint
        run: docker run --rm playwright-api-automation ruff check .

      - name: Type check
        run: docker run --rm playwright-api-automation mypy utils/ pages/ scripts/

      - name: Python dependency scan
        run: docker run --rm playwright-api-automation pip-audit -r requirements.txt --progress-spinner off

      - name: Container image scan
        # aquasecurity/trivy-action pinned to v0.36.0 for supply-chain hygiene
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: playwright-api-automation
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify test collection
        run: docker run --rm playwright-api-automation pytest --collect-only -q

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Run script unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/scripts/ -v --junitxml=artifacts/scripts-report.xml

      - name: Publish Script Unit Test Results
        if: always()
        # dorny/test-reporter pinned to v1.9.1 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5
        with:
          name: Script Unit Test Results
          path: artifacts/scripts-report.xml
          reporter: java-junit
          fail-on-error: false

  api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        # Fresh runner — image must be rebuilt; Docker layer caching is a future optimization
        run: docker build -t playwright-api-automation .

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Determine test scope
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ github.event_name }}" == "schedule" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TEST_SCOPE=full" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=" >> "$GITHUB_ENV"
          else
            echo "TEST_SCOPE=smoke" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=-m smoke" >> "$GITHUB_ENV"
          fi

      - name: Run API test suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/api $MARKER_ARGS -v --junitxml=artifacts/api-report.xml

      - name: Run API test suite (prod-read-only)
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            exit 0
          fi
          if [ "${{ vars.PROD_ENV_ACTIVE }}" != "true" ]; then
            echo "Prod-read-only run skipped — PROD_ENV_ACTIVE not set. See ADR-015 activation conditions."
            exit 0
          fi
          # artifacts/api-prod-report.xml is not currently consumed by dorny/test-reporter.
          # Add a test-reporter step in the prod activation slice (ADR-015 activation conditions).
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            -e ENV=prod_read_only \
            playwright-api-automation pytest test/api -m read_only -v \
            --junitxml=artifacts/api-prod-report.xml

      - name: Write test scope to summary
        if: always()
        run: |
          if [ "$TEST_SCOPE" = "smoke" ]; then
            echo "> **Smoke run** — smoke-tagged tests only. Full regression runs on push to \`main\`, nightly schedule, and \`workflow_dispatch\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write dynamic API test summary
        if: always()
        run: python scripts/ci_summary.py artifacts/api-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Run release readiness gate
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            echo "Smoke-only run — release gate skipped."
            exit 0
          fi
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation python scripts/release_gate.py artifacts/api-report.xml

      - name: Upload release readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: |
            artifacts/release-readiness.json
            artifacts/release-readiness.md
          if-no-files-found: ignore
          overwrite: true

      - name: Write release gate summary
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            echo "## Release Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Smoke run** — release gate skipped. Full release readiness runs on push to \`main\`, nightly schedule, and \`workflow_dispatch\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/release-readiness.md ]; then
            cat artifacts/release-readiness.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> \`artifacts/release-readiness.md\` not found — gate script did not produce output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish API test report
        if: always()
        # dorny/test-reporter pinned to v1.9.1 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5
        with:
          name: API Test Results
          path: artifacts/api-report.xml
          reporter: java-junit
          fail-on-error: false

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        # Fresh runner — image must be rebuilt; Docker layer caching is a future optimization
        run: docker build -t playwright-api-automation .

      - name: Prepare artifacts directory
        run: |
          # Ensure the mounted failure-artifacts directory exists for UI screenshot/HTML capture.
          rm -rf artifacts/failures
          mkdir -p artifacts/failures

      - name: Determine test scope
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ github.event_name }}" == "schedule" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TEST_SCOPE=full" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=" >> "$GITHUB_ENV"
          else
            echo "TEST_SCOPE=smoke" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=-m smoke" >> "$GITHUB_ENV"
          fi

      - name: Run UI test suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/ui $MARKER_ARGS -v --junitxml=artifacts/ui-report.xml

      - name: Run UI test suite (prod-read-only)
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            exit 0
          fi
          if [ "${{ vars.PROD_ENV_ACTIVE }}" != "true" ]; then
            echo "Prod-read-only run skipped — PROD_ENV_ACTIVE not set. See ADR-015 activation conditions."
            exit 0
          fi
          # artifacts/ui-prod-report.xml is not currently consumed by dorny/test-reporter.
          # Add a test-reporter step in the prod activation slice (ADR-015 activation conditions).
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            -e ENV=prod_read_only \
            playwright-api-automation pytest test/ui -m read_only -v \
            --junitxml=artifacts/ui-prod-report.xml

      - name: Write test scope to summary
        if: always()
        run: |
          if [ "$TEST_SCOPE" = "smoke" ]; then
            echo "> **Smoke run** — smoke-tagged tests only. Full regression runs on push to \`main\`, nightly schedule, and \`workflow_dispatch\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write dynamic UI test summary
        if: always()
        run: python scripts/ci_summary.py artifacts/ui-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publish UI test report
        if: always()
        # dorny/test-reporter pinned to v1.9.1 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5
        with:
          name: UI Test Results
          path: artifacts/ui-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: artifacts/failures/
          if-no-files-found: ignore

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, api, ui]
    if: >-
      always() && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.test.result != 'success' || needs.api.result != 'success' || needs.ui.result != 'success')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release readiness artifact
        uses: actions/download-artifact@v4
        with:
          name: release-readiness-report
          path: artifacts/
        continue-on-error: true

      - name: Deliver aggregate CI notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_RECIPIENTS: ${{ secrets.NOTIFY_RECIPIENTS }}
          NOTIFY_DRY_RUN: ${{ vars.NOTIFY_DRY_RUN }}
          DOCKER_TEST_SUITE_RESULT: ${{ needs.test.result }}
          API_TESTS_RESULT: ${{ needs.api.result }}
          UI_TESTS_RESULT: ${{ needs.ui.result }}
        run: python scripts/notify.py
