name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Nightly 02:00 UTC — runs on default branch (main)
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope — full runs all tests and the release gate; smoke runs smoke-tagged tests only"
        required: false
        default: full
        type: choice
        options:
          - full
          - smoke
      notification_mode:
        description: "Notification mode — repo_default uses NOTIFY_DRY_RUN variable; dry_run/live override for this manual run"
        required: false
        default: repo_default
        type: choice
        options:
          - repo_default
          - dry_run
          - live

permissions:
  contents: read
  checks: write  # required by dorny/test-reporter to create check annotations

jobs:
  test:
    name: Docker Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          for i in 1 2 3; do
            docker build -t playwright-api-automation . && break

            if [ "$i" -lt 3 ]; then
              wait_seconds=$((i * 30))
              echo "Docker build attempt $i/3 failed — retrying in ${wait_seconds}s"
              sleep "$wait_seconds"
            else
              echo "Docker build failed after 3 attempts"
              exit 1
            fi
          done

      - name: Check formatting
        run: docker run --rm playwright-api-automation ruff format --check .

      - name: Lint
        run: docker run --rm playwright-api-automation ruff check .

      - name: Type check
        run: docker run --rm playwright-api-automation mypy utils/ pages/ scripts/

      - name: Python dependency scan
        run: docker run --rm playwright-api-automation pip-audit -r requirements.txt --progress-spinner off

      - name: Container image scan
        # aquasecurity/trivy-action pinned to v0.36.0 for supply-chain hygiene
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: playwright-api-automation
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify test collection
        run: docker run --rm playwright-api-automation pytest --collect-only -q

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Run script unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/scripts/ -v --junitxml=artifacts/scripts-report.xml

      - name: Check script test report exists
        id: script_report
        if: always()
        run: |
          if [[ -f artifacts/scripts-report.xml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Script test report not found — upstream step did not produce artifacts/scripts-report.xml" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Script Unit Test Results
        if: always() && steps.script_report.outputs.exists == 'true'
        # dorny/test-reporter pinned to v3.0.0 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Script Unit Test Results
          path: artifacts/scripts-report.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: false  # v3.0.0 changed default to true; preserve GitHub Check Run panels

      - name: Save Docker image
        run: docker save playwright-api-automation | gzip > /tmp/playwright-api-automation.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-api-automation-image
          path: /tmp/playwright-api-automation.tar.gz
          retention-days: 1
          if-no-files-found: error

  api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-api-automation-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/playwright-api-automation.tar.gz | docker load

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Determine test scope
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SCOPE="${{ inputs.test_scope }}"
            SCOPE="${SCOPE:-full}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
               [[ "${{ github.event_name }}" == "schedule" ]]; then
            SCOPE="full"
          else
            SCOPE="smoke"
          fi

          if [[ "$SCOPE" == "full" ]]; then
            echo "TEST_SCOPE=full" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=" >> "$GITHUB_ENV"
          else
            echo "TEST_SCOPE=smoke" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=-m smoke" >> "$GITHUB_ENV"
          fi

      - name: Run API test suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/api $MARKER_ARGS -v -n auto --junitxml=artifacts/api-report.xml

      - name: Run API test suite (prod-read-only)
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            exit 0
          fi
          if [ "${{ vars.PROD_ENV_ACTIVE }}" != "true" ]; then
            echo "Prod-read-only run skipped — PROD_ENV_ACTIVE not set. See ADR-015 activation conditions."
            exit 0
          fi
          # artifacts/api-prod-report.xml is not currently consumed by dorny/test-reporter.
          # Add a test-reporter step in the prod activation slice (ADR-015 activation conditions).
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            -e ENV=prod_read_only \
            playwright-api-automation pytest test/api -m read_only -v \
            --junitxml=artifacts/api-prod-report.xml

      - name: Write test scope to summary
        if: always()
        run: |
          if [ "$TEST_SCOPE" = "smoke" ]; then
            echo "> **Smoke run** — smoke-tagged tests only. Full regression runs on push to \`main\` and nightly schedule." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check API test report exists
        id: api_report
        if: always()
        run: |
          if [[ -f artifacts/api-report.xml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "API test report not found — upstream step did not produce artifacts/api-report.xml" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write dynamic API test summary
        if: always() && steps.api_report.outputs.exists == 'true'
        run: python scripts/ci_summary.py artifacts/api-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Run release readiness gate
        if: always()
        run: |
          if [ -z "${TEST_SCOPE:-}" ]; then
            mkdir -p artifacts
            if [ -f scripts/release_gate.py ]; then
              python scripts/release_gate.py --skipped "unknown"
            else
              echo "## Release Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> Release gate skipped — repository checkout was unavailable and TEST_SCOPE was not set." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ "$TEST_SCOPE" != "full" ]; then
            docker run --rm \
              -v ${{ github.workspace }}/artifacts:/app/artifacts \
              playwright-api-automation python scripts/release_gate.py --skipped "$TEST_SCOPE"
            exit 0
          fi
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation python scripts/release_gate.py artifacts/api-report.xml

      - name: Upload release readiness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-report
          path: |
            artifacts/release-readiness.json
            artifacts/release-readiness.md
          if-no-files-found: ignore
          overwrite: true

      - name: Write release gate summary
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            echo "## Release Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Smoke run** — release gate skipped. Full release readiness runs on push to \`main\` and nightly schedule." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/release-readiness.md ]; then
            cat artifacts/release-readiness.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> \`artifacts/release-readiness.md\` not found — gate script did not produce output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish API test report
        if: always() && steps.api_report.outputs.exists == 'true'
        # dorny/test-reporter pinned to v3.0.0 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: API Test Results
          path: artifacts/api-report.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: false  # v3.0.0 changed default to true; preserve GitHub Check Run panels

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-api-automation-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/playwright-api-automation.tar.gz | docker load

      - name: Prepare artifacts directory
        run: |
          # Ensure the mounted failure-artifacts directory exists for UI screenshot/HTML capture.
          rm -rf artifacts/failures
          mkdir -p artifacts/failures

      - name: Determine test scope
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SCOPE="${{ inputs.test_scope }}"
            SCOPE="${SCOPE:-full}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
               [[ "${{ github.event_name }}" == "schedule" ]]; then
            SCOPE="full"
          else
            SCOPE="smoke"
          fi

          if [[ "$SCOPE" == "full" ]]; then
            echo "TEST_SCOPE=full" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=" >> "$GITHUB_ENV"
          else
            echo "TEST_SCOPE=smoke" >> "$GITHUB_ENV"
            echo "MARKER_ARGS=-m smoke" >> "$GITHUB_ENV"
          fi

      - name: Run UI test suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/ui $MARKER_ARGS -v -n auto --junitxml=artifacts/ui-report.xml

      - name: Run UI test suite (prod-read-only)
        if: always()
        run: |
          if [ "$TEST_SCOPE" != "full" ]; then
            exit 0
          fi
          if [ "${{ vars.PROD_ENV_ACTIVE }}" != "true" ]; then
            echo "Prod-read-only run skipped — PROD_ENV_ACTIVE not set. See ADR-015 activation conditions."
            exit 0
          fi
          # artifacts/ui-prod-report.xml is not currently consumed by dorny/test-reporter.
          # Add a test-reporter step in the prod activation slice (ADR-015 activation conditions).
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            -e ENV=prod_read_only \
            playwright-api-automation pytest test/ui -m read_only -v \
            --junitxml=artifacts/ui-prod-report.xml

      - name: Write test scope to summary
        if: always()
        run: |
          if [ "$TEST_SCOPE" = "smoke" ]; then
            echo "> **Smoke run** — smoke-tagged tests only. Full regression runs on push to \`main\` and nightly schedule." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check UI test report exists
        id: ui_report
        if: always()
        run: |
          if [[ -f artifacts/ui-report.xml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "UI test report not found — upstream step did not produce artifacts/ui-report.xml" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write dynamic UI test summary
        if: always() && steps.ui_report.outputs.exists == 'true'
        run: python scripts/ci_summary.py artifacts/ui-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publish UI test report
        if: always() && steps.ui_report.outputs.exists == 'true'
        # dorny/test-reporter pinned to v3.0.0 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: UI Test Results
          path: artifacts/ui-report.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: false  # v3.0.0 changed default to true; preserve GitHub Check Run panels

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-artifacts
          path: artifacts/failures/
          if-no-files-found: ignore

  ui-cross-browser:
    name: UI Cross-Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-api-automation-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/playwright-api-automation.tar.gz | docker load

      - name: Prepare artifacts directory
        run: |
          rm -rf artifacts/failures
          mkdir -p artifacts/failures

      - name: Run UI smoke suite (${{ matrix.browser }})
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            playwright-api-automation pytest test/ui -m smoke -v \
            --browser ${{ matrix.browser }} \
            --junitxml=artifacts/ui-${{ matrix.browser }}-report.xml

      - name: Check cross-browser report exists
        id: cb_report
        if: always()
        run: |
          if [[ -f artifacts/ui-${{ matrix.browser }}-report.xml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "UI cross-browser report not found — upstream step did not produce the JUnit artifact" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write cross-browser test summary
        if: always() && steps.cb_report.outputs.exists == 'true'
        run: |
          python scripts/ci_summary.py artifacts/ui-${{ matrix.browser }}-report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publish cross-browser test report
        if: always() && steps.cb_report.outputs.exists == 'true'
        # dorny/test-reporter pinned to v3.0.0 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: UI Cross-Browser Results (${{ matrix.browser }})
          path: artifacts/ui-${{ matrix.browser }}-report.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: false  # v3.0.0 changed default to true; preserve GitHub Check Run panels

      - name: Upload failure artifacts (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: artifacts/failures/
          if-no-files-found: ignore

      - name: Write cross-browser execution status
        if: always()
        run: |
          mkdir -p artifacts
          if [[ -f "artifacts/ui-${{ matrix.browser }}-report.xml" ]]; then
            FAILURES=$(python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('artifacts/ui-${{ matrix.browser }}-report.xml').getroot(); suites=root.findall('testsuite') if root.tag=='testsuites' else [root]; print(sum(int(s.get('failures',0))+int(s.get('errors',0)) for s in suites))" 2>/dev/null) || FAILURES=1
            STATUS=$([[ "$FAILURES" == "0" ]] && echo "PASS" || echo "FAIL")
          else
            STATUS="FAIL"
          fi
          python3 -c "import json,sys; from datetime import datetime,timezone; json.dump({'status':sys.argv[1],'browser':sys.argv[2],'timestamp':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')},open('artifacts/cross-browser-${{ matrix.browser }}-status.json','w'),indent=2)" "$STATUS" "${{ matrix.browser }}"

      - name: Upload cross-browser status artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-${{ matrix.browser }}-execution-status
          path: artifacts/cross-browser-${{ matrix.browser }}-status.json
          if-no-files-found: ignore

  cloud-grid:
    name: Cloud Grid (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-api-automation-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/playwright-api-automation.tar.gz | docker load

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Run cloud-grid preflight
        env:
          CLOUD_GRID_PROVIDER: ${{ vars.CLOUD_GRID_PROVIDER }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ vars.SAUCE_REGION }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            -e CLOUD_GRID_PROVIDER="${CLOUD_GRID_PROVIDER:-none}" \
            -e SAUCE_USERNAME="${SAUCE_USERNAME}" \
            -e SAUCE_ACCESS_KEY="${SAUCE_ACCESS_KEY}" \
            -e SAUCE_REGION="${SAUCE_REGION:-us-west-1}" \
            -e BROWSERSTACK_USERNAME="${BROWSERSTACK_USERNAME}" \
            -e BROWSERSTACK_ACCESS_KEY="${BROWSERSTACK_ACCESS_KEY}" \
            playwright-api-automation python scripts/cloud_grid_preflight.py

      - name: Write preflight summary
        if: always()
        run: |
          if [[ -f artifacts/cloud-grid-preflight.md ]]; then
            cat artifacts/cloud-grid-preflight.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read preflight status
        id: preflight
        if: always()
        run: |
          if [[ -f artifacts/cloud-grid-preflight.json ]]; then
            STATUS=$(python3 -c "import json; print(json.load(open('artifacts/cloud-grid-preflight.json'))['status'])")
            echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          else
            echo "status=ERROR_PREFLIGHT_STATUS_UNAVAILABLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cloud-grid smoke suite
        id: cloud_grid_run
        if: steps.preflight.outputs.status == 'READY'
        continue-on-error: true
        env:
          CLOUD_GRID_PROVIDER: ${{ vars.CLOUD_GRID_PROVIDER }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ vars.SAUCE_REGION }}
          SAUCE_CONNECT_TIMEOUT_MS: ${{ vars.SAUCE_CONNECT_TIMEOUT_MS }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_CONNECT_TIMEOUT_MS: ${{ vars.BROWSERSTACK_CONNECT_TIMEOUT_MS }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/artifacts:/app/artifacts \
            -e CLOUD_GRID_PROVIDER="${CLOUD_GRID_PROVIDER}" \
            -e SAUCE_USERNAME="${SAUCE_USERNAME}" \
            -e SAUCE_ACCESS_KEY="${SAUCE_ACCESS_KEY}" \
            -e SAUCE_REGION="${SAUCE_REGION:-us-west-1}" \
            -e SAUCE_CONNECT_TIMEOUT_MS="${SAUCE_CONNECT_TIMEOUT_MS:-60000}" \
            -e BROWSERSTACK_USERNAME="${BROWSERSTACK_USERNAME}" \
            -e BROWSERSTACK_ACCESS_KEY="${BROWSERSTACK_ACCESS_KEY}" \
            -e BROWSERSTACK_CONNECT_TIMEOUT_MS="${BROWSERSTACK_CONNECT_TIMEOUT_MS:-60000}" \
            playwright-api-automation pytest test/ui -m smoke -v \
            --browser ${{ matrix.browser }} \
            --junitxml=artifacts/cloud-grid-${{ matrix.browser }}-report.xml

      - name: Record cloud-grid non-ready status
        if: steps.preflight.outputs.status != 'READY'
        run: |
          PREFLIGHT="${{ steps.preflight.outputs.status }}"
          if [[ "$PREFLIGHT" == SKIPPED_* ]]; then
            echo "### ⏭️ Cloud Grid Skipped (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
            echo "Preflight status: \`$PREFLIGHT\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Cloud Grid Not Run — Preflight Error (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
            echo "Preflight status: \`$PREFLIGHT\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the Run cloud-grid preflight step output above for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check cloud-grid report exists
        id: cg_report
        if: always()
        run: |
          if [[ -f "artifacts/cloud-grid-${{ matrix.browser }}-report.xml" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write cloud-grid execution status
        if: always()
        run: |
          mkdir -p artifacts
          PREFLIGHT="${{ steps.preflight.outputs.status }}"
          PREFLIGHT="${PREFLIGHT:-ERROR_PREFLIGHT_STATUS_UNAVAILABLE}"
          CG_OUTCOME="${{ steps.cloud_grid_run.outcome }}"
          CG_REPORT="${{ steps.cg_report.outputs.exists }}"

          if [[ "$PREFLIGHT" == "READY" && "$CG_OUTCOME" == "success" ]]; then
            STATUS="PASS"
            DETAIL="smoke suite passed"
          elif [[ "$PREFLIGHT" == "READY" && "$CG_REPORT" == "true" ]]; then
            STATUS="FAIL"
            DETAIL="cloud-grid smoke execution failed; see cloud-grid-${{ matrix.browser }}-report.xml for provider or test details"
          elif [[ "$PREFLIGHT" == "READY" ]]; then
            STATUS="FAIL"
            DETAIL="remote session could not be provisioned or connection timed out"
          elif [[ "$PREFLIGHT" == SKIPPED_* ]]; then
            STATUS="SKIPPED"
            DETAIL="preflight status: $PREFLIGHT"
          else
            STATUS="FAIL"
            DETAIL="cloud-grid preflight failed: $PREFLIGHT"
          fi

          python3 -c "import json,sys; from datetime import datetime,timezone; json.dump({'status':sys.argv[1],'detail':sys.argv[2],'browser':sys.argv[3],'provider':sys.argv[4],'timestamp':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')},open('artifacts/cloud-grid-${{ matrix.browser }}-status.json','w'),indent=2)" "$STATUS" "$DETAIL" "${{ matrix.browser }}" "${{ vars.CLOUD_GRID_PROVIDER }}"

      - name: Write cloud-grid test summary
        if: always() && steps.cg_report.outputs.exists == 'true'
        run: python scripts/ci_summary.py "artifacts/cloud-grid-${{ matrix.browser }}-report.xml" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish cloud-grid test report
        if: always() && steps.cg_report.outputs.exists == 'true'
        # dorny/test-reporter pinned to v3.0.0 for third-party action supply-chain hygiene
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Cloud Grid Test Results (Sauce Labs ${{ matrix.browser }})
          path: artifacts/cloud-grid-${{ matrix.browser }}-report.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: false  # v3.0.0 changed default to true; preserve GitHub Check Run panels

      - name: Upload cloud-grid artifacts
        if: always() && steps.cg_report.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cloud-grid-artifacts-${{ matrix.browser }}
          path: |
            artifacts/cloud-grid-${{ matrix.browser }}-report.xml
            artifacts/cloud-grid-preflight.json
            artifacts/cloud-grid-preflight.md
          if-no-files-found: ignore

      - name: Upload cloud-grid status artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-grid-${{ matrix.browser }}-execution-status
          path: artifacts/cloud-grid-${{ matrix.browser }}-status.json
          if-no-files-found: ignore

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, api, ui, ui-cross-browser, cloud-grid]
    if: >-
      always() && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.test.result != 'success' || needs.api.result != 'success' || needs.ui.result != 'success')) ||
      (github.event_name == 'pull_request' && vars.NOTIFY_PR_FAILURES == 'true' &&
      (needs.test.result != 'success' || needs.api.result != 'success' || needs.ui.result != 'success')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download release readiness artifact
        uses: actions/download-artifact@v8
        with:
          name: release-readiness-report
          path: artifacts/
        continue-on-error: true

      - name: Download cloud-grid status artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cloud-grid-*-execution-status
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Download cross-browser status artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cross-browser-*-execution-status
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Determine notification mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.notification_mode }}" == "dry_run" ]]; then
              echo "NOTIFY_DRY_RUN=true" >> "$GITHUB_ENV"
            elif [[ "${{ inputs.notification_mode }}" == "live" ]]; then
              echo "NOTIFY_DRY_RUN=" >> "$GITHUB_ENV"
            else
              echo "NOTIFY_DRY_RUN=${{ vars.NOTIFY_DRY_RUN }}" >> "$GITHUB_ENV"
            fi
          else
            echo "NOTIFY_DRY_RUN=${{ vars.NOTIFY_DRY_RUN }}" >> "$GITHUB_ENV"
          fi

      - name: Deliver aggregate CI notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_RECIPIENTS: ${{ secrets.NOTIFY_RECIPIENTS }}
          DOCKER_TEST_SUITE_RESULT: ${{ needs.test.result }}
          API_TESTS_RESULT: ${{ needs.api.result }}
          UI_TESTS_RESULT: ${{ needs.ui.result }}
          UI_CROSS_BROWSER_RESULT: ${{ needs['ui-cross-browser'].result }}
          CLOUD_GRID_RESULT: ${{ needs['cloud-grid'].result }}
        run: python scripts/notify.py
