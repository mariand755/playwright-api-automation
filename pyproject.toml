[tool.ruff]
line-length = 88
target-version = "py39"
# Markdown files hold illustrative/pseudo-code snippets, not real source —
# never a target for ruff format/lint, regardless of tool defaults.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
