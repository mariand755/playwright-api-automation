[pytest]

minversion = 7.0

testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short

markers =
    ui: UI tests
    api: API tests
    smoke: Smoke tests
    negative: marks tests for negative/error-path scenarios
    regression: marks tests for full-suite regression coverage
    api_contract: marks tests that validate API response schema against a declared JSON schema contract
    tc_id: marks tests with a unique test case ID for traceability (e.g. TC-UI-001, TC-API-001)
    read_only: marks tests safe to run against production read-only environments (no writes, creates, updates, or deletes)
    scripts: Script unit tests — validates release-readiness and notification decision logic
