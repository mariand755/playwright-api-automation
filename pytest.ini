[pytest]

minversion = 7.0

testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short

markers =
    ui: UI tests
    api: API tests
    smoke: Smoke tests
    negative: marks tests for negative/error-path scenarios
    regression: marks tests for full-suite regression coverage